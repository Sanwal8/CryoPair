[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryopair"
version = "0.2.0"
description = "Patient-paired adaptation and feature mapping for RNA prediction from frozen histology"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Sanwal Ahmad Zafar", email = "sanwal.ahmadzafar@csmc.edu"}]
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
slides = ["torch>=2.5", "timm==1.0.19", "safetensors", "openslide-python", "Pillow", "scipy"]
train = ["torch>=2.5", "timm==1.0.19", "safetensors", "pandas"]

[project.urls]
Repository = "https://github.com/Sanwal8/CryoPair"

[project.scripts]
cryopair-predict = "cryopair_predict:main"
cryopair-fit = "cryopair_fit:main"
cryopair-train = "cryopair_train:main"

[tool.setuptools]
py-modules = ["cryopair_predict", "cryopair_fit", "cryopair_train"]
